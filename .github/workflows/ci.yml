name: CI

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orchestrator, ingestor, summarize, viz]
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.service }}/requirements.txt
          pip install -r dev-requirements.txt || true
      
      - name: Lint & type-check
        run: |
          ruff check ${{ matrix.service }} || true
          ruff format --check ${{ matrix.service }} || true
          pyright ${{ matrix.service }} || true
      
      - name: Unit tests
        run: |
          cd ${{ matrix.service }}
          pytest tests/ -v || echo "no tests yet"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install
        run: npm ci || npm i
      
      - name: Typecheck
        run: npx tsc --noEmit
      
      - name: Build
        run: npm run build

